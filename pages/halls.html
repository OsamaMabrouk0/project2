<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f1e7">
  <meta name="description" content="دليلك التفاعلي لكلية الأعمال — جامعة الإسكندرية: ابحث عن القاعات، استكشف الخريطة، وتعرّف على الأقسام. · Interactive guide to the Faculty of Business, Alexandria University.">
  <title>مرشدك في كلية الأعمال · Your Guide to the Faculty of Business</title>
  <link rel="icon" href="../assets/images/faculty-logo.png">
  <script>
    /* Boot flags: applied before first paint to avoid flashes (theme, language, loader, route curtain) */
    (function () {
      var d = document.documentElement;
      d.classList.add('js');
      try {
        var t = localStorage.getItem('guide-theme');
        if (!t && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
        if (t) d.dataset.theme = t;
        if (localStorage.getItem('guide-lang') === 'en') { d.lang = 'en'; d.dir = 'ltr'; }
        var s = sessionStorage;
        if (s.getItem('guide-nav')) { s.removeItem('guide-nav'); d.classList.add('is-arriving'); s.setItem('guide-splash', '1'); }
        else if (!s.getItem('guide-splash')) d.classList.add('has-loader');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/motion.css">
  <link rel="stylesheet" href="../assets/css/pages/halls.css">
</head>
<body data-page="halls" data-base="../">
<main id="main" class="page wrap">
    <header class="page-hero " style="--tone: var(--coral)">
      <p class="eyebrow" data-reveal><b><i data-lucide="door-open"></i></b><span data-i18n="nav.halls"></span></p>
      <h1 data-i18n="halls.title" data-split></h1>
      <p class="lead" data-i18n="halls.sub" data-reveal></p>
      <form class="search" role="search" onsubmit="return false" data-reveal>
        <i data-lucide="search"></i>
        <input id="q" type="search" autocomplete="off" spellcheck="false" data-search-field data-i18n-ph="halls.ph" data-i18n-label="halls.aria">
        <kbd class="kbd" aria-hidden="true">/</kbd>
        <button id="clear" class="icon-btn" type="button" hidden data-i18n-label="halls.clear"><i data-lucide="x"></i></button>
      </form>
    </header>

  <section class="board" aria-label="Filters">
    <div class="filter-row"><span class="filter-l" data-i18n="halls.type"></span><div class="seg seg-fill" id="typeSeg" role="group"></div></div>
    <div class="filter-row"><span class="filter-l" data-i18n="halls.building"></span><div class="chips scroll-row fade-row" id="bChips"></div></div>
  </section>

  <p class="status" id="status" role="status" aria-live="polite"></p>
  <div id="results"></div>
</main>
  <script src="../assets/vendor/lucide.min.js"></script>
  <script src="../data/translations.js"></script>
  <script src="../assets/js/core/runtime.js"></script>
  <script src="../data/buildings.js"></script>
  <script src="../data/spaces.js"></script>
  <script src="../assets/js/services/search-engine.js"></script>
  <script src="../assets/js/core/shell.js"></script>
  <script src="../assets/js/core/motion.js"></script>
  <script src="../assets/js/pages/halls.js"></script>
</body>
</html>
