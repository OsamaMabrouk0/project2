  <script>
    /* Boot flags: applied before first paint to avoid flashes (theme, language, loader, route curtain) */
    (function () {
      var d = document.documentElement;
      d.classList.add('js');
      try {
        var t = localStorage.getItem('guide-theme');
        if (!t && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
        if (t) d.dataset.theme = t;
        if (localStorage.getItem('guide-lang') === 'en') { d.lang = 'en'; d.dir = 'ltr'; }
        var s = sessionStorage;
        if (s.getItem('guide-nav')) { s.removeItem('guide-nav'); d.classList.add('is-arriving'); s.setItem('guide-splash', '1'); }
        else if (!s.getItem('guide-splash')) d.classList.add('has-loader');
      } catch (e) {}
    })();
  </script>
