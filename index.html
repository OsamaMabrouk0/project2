<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f1e7">
  <meta name="description" content="دليلك التفاعلي لكلية الأعمال — جامعة الإسكندرية: ابحث عن القاعات، استكشف الخريطة، وتعرّف على الأقسام. · Interactive guide to the Faculty of Business, Alexandria University.">
  <title>مرشدك في كلية الأعمال · Your Guide to the Faculty of Business</title>
  <link rel="icon" href="assets/images/faculty-logo.png">
  <script>
    /* Boot flags: applied before first paint to avoid flashes (theme, language, loader, route curtain) */
    (function () {
      var d = document.documentElement;
      d.classList.add('js');
      try {
        var t = localStorage.getItem('guide-theme');
        if (!t && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
        if (t) d.dataset.theme = t;
        if (localStorage.getItem('guide-lang') === 'en') { d.lang = 'en'; d.dir = 'ltr'; }
        var s = sessionStorage;
        if (s.getItem('guide-nav')) { s.removeItem('guide-nav'); d.classList.add('is-arriving'); s.setItem('guide-splash', '1'); }
        else if (!s.getItem('guide-splash')) d.classList.add('has-loader');
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/motion.css">
  <link rel="stylesheet" href="assets/css/pages/home.css">
</head>
<body data-page="home" data-base="">
<main id="main">
  <section class="hero wrap">
    <div class="hero-copy">
      <p class="eyebrow" data-reveal><b>01</b><span data-i18n="site.faculty"></span></p>
      <h1 data-i18n="home.title" data-split></h1>
      <p class="lead" data-i18n="home.sub" data-reveal></p>
      <form class="search" id="heroSearch" role="search" data-reveal>
        <i data-lucide="search"></i>
        <input name="q" type="search" autocomplete="off" spellcheck="false" data-search-field data-i18n-ph="home.ph" data-i18n-label="halls.aria">
        <kbd class="kbd" aria-hidden="true">/</kbd>
        <button class="btn" type="submit"><span data-i18n="home.go"></span><i data-lucide="arrow-left" class="nudge arr-l"></i><i data-lucide="arrow-right" class="nudge arr-r"></i></button>
      </form>
      <div class="try" id="try" data-reveal></div>
    </div>

    <a class="postcard" href="pages/map.html" data-reveal="tilt" style="--rot: 0deg; --rot-from: 5deg" data-i18n-label="home.preview">
      <figure class="postcard-frame">
        <div class="pc-img"><div class="sk" id="heroSk"></div><img id="heroImg" src="assets/images/campus-map.png" alt=""><div id="heroPins"></div></div>
        <figcaption class="pc-cap"><span><i data-lucide="map-pin"></i><b data-i18n="home.preview"></b></span><i data-lucide="mouse-pointer-click"></i></figcaption>
      </figure>
      <span class="float-ticket" id="floatTicket"></span>
      <span class="sticker" aria-hidden="true"><span><i data-lucide="compass"></i><b data-i18n="home.sticker"></b></span></span>
    </a>
  </section>

  <div class="ticker" aria-hidden="true"><div class="marquee"><div class="marquee-track" id="ticker"></div></div></div>

  <section class="numbers wrap" aria-label="Numbers"><ul id="stats" data-stagger></ul></section>

  <section class="explore wrap">
    <div class="sec-head">
      <h2 data-i18n="home.explore" data-split style="--tone: var(--mint)"></h2>
      <p data-i18n="home.exploreSub" data-reveal></p>
    </div>
    <div class="bento" id="tiles" data-stagger></div>
  </section>

  <section class="how wrap">
    <div class="sec-head"><h2 data-i18n="home.howT" data-split style="--tone: var(--lilac)"></h2></div>
    <ol class="steps" data-stagger>
      <li class="step tone-coral" data-reveal><span class="step-no">1</span><i data-lucide="search"></i><h3 data-i18n="home.how1"></h3><p data-i18n="home.how1d"></p></li>
      <li class="step tone-sun" data-reveal><span class="step-no">2</span><i data-lucide="map-pin"></i><h3 data-i18n="home.how2"></h3><p data-i18n="home.how2d"></p></li>
      <li class="step tone-mint" data-reveal><span class="step-no">3</span><i data-lucide="footprints"></i><h3 data-i18n="home.how3"></h3><p data-i18n="home.how3d"></p></li>
    </ol>
  </section>

  <section class="cta wrap">
    <div class="cta-box" data-reveal="scale">
      <h2 data-i18n="home.cta2"></h2>
      <div class="btn-row">
        <a class="btn" href="pages/map.html" data-magnet><i data-lucide="map"></i><span data-i18n="tile.map.btn"></span></a>
        <a class="btn btn-paper" href="pages/halls.html" data-magnet><i data-lucide="door-open"></i><span data-i18n="tile.halls.btn"></span></a>
      </div>
    </div>
  </section>
</main>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="data/translations.js"></script>
  <script src="assets/js/core/runtime.js"></script>
  <script src="data/buildings.js"></script>
  <script src="data/spaces.js"></script>
  <script src="data/departments.js"></script>
  <script src="data/team.js"></script>
  <script src="assets/js/core/shell.js"></script>
  <script src="assets/js/core/motion.js"></script>
  <script src="assets/js/pages/home.js"></script>
</body>
</html>
